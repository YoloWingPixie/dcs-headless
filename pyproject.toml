[project]
name = "dcs-headless"
version = "0.1.0"
description = "Run DCS World headless from WSL in an isolated Saved Games profile"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dcs-headless = "dcs_headless.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_headless"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
