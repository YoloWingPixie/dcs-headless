version: '3'

vars:
  PROFILE: '{{.PROFILE | default "DCS.headless"}}'
  GRPC: '{{.GRPC | default ""}}'

tasks:
  default:
    deps: [ci]

  setup:
    desc: "Install dependencies with uv"
    cmds:
      - uv sync

  test:
    desc: "Run the unit tests (no DCS needed)"
    cmds:
      - uv run pytest -q {{.CLI_ARGS}}

  lint:
    desc: "Check lint and formatting"
    cmds:
      - uv run ruff check src tests
      - uv run ruff format --check src tests

  fmt:
    desc: "Fix lint and format"
    cmds:
      - uv run ruff check --fix src tests
      - uv run ruff format src tests

  ci:
    desc: "Setup, lint and test"
    cmds:
      - task: setup
      - task: lint
      - task: test

  paths:
    desc: "Print resolved paths"
    cmds:
      - uv run dcs-headless paths {{.CLI_ARGS}}

  prepare:
    desc: "Create or reset the isolated profile (PROFILE=DCS.headless)"
    cmds:
      - uv run dcs-headless prepare --profile {{.PROFILE}} {{.CLI_ARGS}}

  server:
    desc: "Run a mission on a private server until Ctrl+C (MISSION=file.miz, GRPC=1 for DCS-gRPC)"
    prompt: Launch DCS headless? Close any running DCS first.
    requires:
      vars: [MISSION]
    cmds:
      - uv run dcs-headless run --until-stopped --mission "{{.MISSION}}" --profile {{.PROFILE}} --out out/server {{if eq .GRPC "1"}}--with-grpc{{end}} {{.CLI_ARGS}}

  server:menu:
    desc: "Run DCS at the menu, no mission, until Ctrl+C (GRPC=1 for DCS-gRPC)"
    prompt: Launch DCS headless? Close any running DCS first.
    cmds:
      - uv run dcs-headless run --until-stopped --profile {{.PROFILE}} --out out/server-menu {{if eq .GRPC "1"}}--with-grpc{{end}} {{.CLI_ARGS}}

  status:
    desc: "State of the recorded DCS process"
    cmds:
      - uv run dcs-headless status --profile {{.PROFILE}} {{.CLI_ARGS}}

  stop:
    desc: "Stop the recorded DCS process and delete auth files"
    cmds:
      - uv run dcs-headless stop --profile {{.PROFILE}} {{.CLI_ARGS}}

  smoke:
    desc: "Launch DCS, wait for startup to finish, stop it"
    prompt: Launch DCS headless? Close any running DCS first.
    cmds:
      - uv run dcs-headless run --wait-log '//=== END OF INIT =+//' --timeout 300 --profile {{.PROFILE}} --out out/smoke {{.CLI_ARGS}}
